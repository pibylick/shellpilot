[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shellpilot"
version = "0.1.0"
description = "Terminal-native AI assistant for Zsh, cmux and iTerm2"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
iterm2 = ["iterm2"]

[project.scripts]
shellpilot = "shellpilot.__main__:main"
